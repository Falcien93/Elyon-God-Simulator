name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Unpacked Linux build
        run: npm run dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Confirm unpacked app
        run: test -x dist/linux-unpacked/elyon
