; Active Steam target: RTX 4060 laptop, 2560x1440, TSR at 67 percent.
; DefaultEngine.ini ScalabilityGroups and DefaultGameUserSettings.ini select these buckets.
; Nanite carries the forest and rocks. Grass cards stay at the Epic density, not cinematic.

[AntiAliasingQuality@3]
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.ScreenPercentage=67

[PostProcessQuality@2]
r.BloomQuality=2
r.SceneColorFringeQuality=0
r.LensFlareQuality=0
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.LightShaftQuality=0

[GlobalIlluminationQuality@3]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.HardwareRayTracing=0
r.Lumen.TraceMeshSDFs=1

[ReflectionQuality@3]
r.ReflectionMethod=1
r.Lumen.Reflections.HardwareRayTracing=0
r.Lumen.Reflections.ScreenTraces=1
r.SSR.Quality=2

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1

[FoliageQuality@3]
foliage.DensityScale=1.5
grass.DensityScale=1.5

; Named preset. The groups above are what the 4060 1440p target turns on.
[RTX4060_1440p]
ResolutionSizeX=2560
ResolutionSizeY=1440
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.ScreenPercentage=67
sg.ResolutionQuality=67
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=2
sg.TextureQuality=3
sg.EffectsQuality=2
sg.FoliageQuality=3
sg.ShadingQuality=3
