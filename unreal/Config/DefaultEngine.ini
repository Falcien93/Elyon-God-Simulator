[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bRemoteExecution=True

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/Day1_Garden
GameDefaultMap=/Game/Maps/Day1_Garden

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; Virtual shadow maps need Shader Model 6 in the D3D12 targeted formats.
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Lumen global illumination. Reflections are Lumen with screen traces, plus SSR for translucent water.
r.ReflectionMethod=1
r.DynamicGlobalIlluminationMethod=1
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
r.Lumen.HardwareRayTracing=False
r.Lumen.Reflections.HardwareRayTracing=False
r.Lumen.Reflections.ScreenTraces=1
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.RayTracing=False
; TSR. The 4060 preset renders at 67 percent and upscales to 1440p.
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.Bloom=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False
r.AllowStaticLighting=False

; RTX 4060 laptop, 1440p, TSR. Epic where Nanite and Lumen carry the image.
; High post and effects, so bloom, shafts, and heavy effects stay off.
[ScalabilityGroups]
sg.ResolutionQuality=67
sg.ViewDistanceQuality=3
sg.AntiAliasingQuality=3
sg.ShadowQuality=3
sg.GlobalIlluminationQuality=3
sg.ReflectionQuality=3
sg.PostProcessQuality=2
sg.TextureQuality=3
sg.EffectsQuality=2
sg.FoliageQuality=3
sg.ShadingQuality=3

[ConsoleVariables]
r.Streaming.PoolSize=2048
; UE 5.8 cached Lumen and real-time sky capture clip above EV 12 at the default.
; 8 widens the safe window so daylight near EV 13 is kept.
r.EyeAdaptation.CachedLightingPreExposure=8
; Height fog is the haze. Volumetric fog and light shafts stay off.
r.VolumetricFog=0
r.LightShaftQuality=0
r.VolumetricCloud=1
r.VolumetricRenderTarget.Mode=1
r.VolumetricCloud.ViewRaySampleMaxCount=64
r.SSR.Quality=2
r.SSR.HalfResSceneColor=1
r.BloomQuality=2
r.SceneColorFringeQuality=0
r.LensFlareQuality=0
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.Nanite.MaxPixelsPerEdge=1
r.ScreenPercentage=67
